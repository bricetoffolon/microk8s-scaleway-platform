# Default values for the api chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: platform-api
namespace: platform

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/OWNER/microk8s-scaleway-platform/api
  tag: latest

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  port: 80
  targetPort: 8000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  host: example.com
  tls:
    - secretName: nginx-tls
      hosts:
        - example.com
  port: 80

readinessProbe:
  httpGet:
    path: /api/healthz                # The path to check for the readiness probe
    port: 8000               # The port to check on
  initialDelaySeconds: 30   # Wait this many seconds before starting the probe
  failureThreshold: 2

configMap:
  data:
    PORT: "8000"
    ALLOWED_ORIGIN: "https://example.com"
    APP_ENV: "default"
    REDIS_URL: "redis://my-redis-master.platform.svc.cluster.local:6379"

secrets:
  data:
    SESSION_SECRET: ""   # base64, injected at deploy time
